<script>
    /* Applied before first paint so a dark-theme visitor never sees a white flash.
       Light is the default; dark is opt-in via the toggle, not the OS setting. */
    (function () {
        var theme = 'light';
        try { theme = localStorage.getItem('ecl.theme') || 'light'; } catch (e) { /* storage blocked */ }
        document.documentElement.setAttribute('data-theme', theme);
    })();
</script>
