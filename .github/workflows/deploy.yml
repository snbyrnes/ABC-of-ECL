# Build checks and deployment to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Nothing reaches Pages without passing these. The asset check is the one
  # that would have caught the manifest pointing at icons that were never
  # committed.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Shared markup is in sync with partials/
        run: node build.js --check

      - name: Local references all resolve
        run: node tools/check-assets.js

      - name: Generated images are current
        run: |
          node tools/make-images.js
          if ! git diff --quiet -- '*.png'; then
            echo "::error::Generated images differ from the committed ones. Run 'node tools/make-images.js' and commit the result."
            git diff --stat -- '*.png'
            exit 1
          fi

      - name: Icon sprite covers every icon in use
        run: |
          node tools/make-icon-sprite.js
          if ! git diff --quiet -- icons.svg; then
            echo "::error::icons.svg is out of date. Run 'node tools/make-icon-sprite.js' and commit the result."
            git diff --stat -- icons.svg
            exit 1
          fi

      - name: JavaScript modules parse
        run: |
          for f in js/*.js sw.js build.js tools/*.js; do
            node --check "$f" || exit 1
          done
          echo "All modules parse."

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
