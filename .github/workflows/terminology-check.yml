# SNOMED CT releases twice a year and concepts get inactivated between releases.
# This turns that slow rot into a caught build rather than an empty result set
# that a learner mistakes for their own mistake.
name: Terminology freshness

on:
  schedule:
    # 07:00 UTC on the first of each month.
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  concepts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check every hard-coded concept ID is still active
        id: concepts
        env:
          # Optional. Without them, Irish extension IDs are skipped rather than
          # reported as failures, so forks without access still get a useful run.
          NMPC_CLIENT_ID: ${{ secrets.NMPC_CLIENT_ID }}
          NMPC_CLIENT_SECRET: ${{ secrets.NMPC_CLIENT_SECRET }}
        run: node tools/verify-concepts.js

      - name: Check outbound links
        if: always()
        run: node tools/check-links.js

      - name: Open an issue when a concept has been inactivated
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Inactive SNOMED concept detected';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'terminology'
            });
            if (existing.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['terminology'],
              body: [
                'The scheduled terminology check found a hard-coded concept ID that is no longer active.',
                '',
                `Run log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Queries using that ID will return nothing, which reads to a learner as their own mistake.',
                'Replace it with its successor concept and re-run `node tools/verify-concepts.js`.'
              ].join('\n')
            });
